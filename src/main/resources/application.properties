spring.application.name=AttendanceTracker
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/attendance;MODE=PostgreSQL;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:unconfigured}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:unconfigured}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.error.include-message=never
app.time-zone=${APP_TIME_ZONE:Europe/Skopje}
app.allowed-coach-emails=${allowed_coach_emails:}
